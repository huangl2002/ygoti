<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YGOTI · 游戏王卡组人格测试</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #222240;
    --text: #e8e0d0;
    --sub: #9a9484;
    --gold: #c9a44b;
    --gold2: #e0c068;
    --accent: #4a7dc9;
    --accent2: #6da0e8;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,.3);
    --border: #3a3550;
    --bar-bg: #2e2a40;
    --selected-bg: #2a2840;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0f0f20;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  .page { display: none; flex-direction: column; min-height: 100vh; padding: 24px 20px; }
  .page.active { display: flex; }

  /* ==================== Landing ==================== */
  #landing {
    justify-content: center;
    align-items: center;
    text-align: center;
    background: radial-gradient(ellipse at 50% 30%, #2a2850 0%, #1a1a2e 70%);
    color: var(--text);
    position: relative;
  }
  #landing::before {
    content: '';
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='28' fill='none' stroke='%23c9a44b20' stroke-width='1'/%3E%3C/svg%3E");
    opacity: .4; pointer-events: none;
  }
  #landing .logo {
    width: 90px; height: 90px;
    background: linear-gradient(135deg, #c9a44b, #e0c068);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; margin-bottom: 20px;
    box-shadow: 0 0 40px rgba(201,164,75,.25);
    position: relative; z-index: 1;
  }
  #landing h1 {
    font-size: 28px; font-weight: 800; margin-bottom: 6px;
    background: linear-gradient(135deg, #e0c068, #c9a44b);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    position: relative; z-index: 1;
  }
  #landing .subtitle { font-size: 14px; color: var(--sub); margin-bottom: 8px; line-height: 1.6; position: relative; z-index: 1; }
  #landing .acronym {
    font-size: 11px; color: #5a5570; letter-spacing: 3px; margin-bottom: 20px;
    position: relative; z-index: 1;
  }
  #landing .features {
    display: flex; gap: 24px; margin-bottom: 32px; font-size: 13px; color: var(--sub);
    position: relative; z-index: 1;
  }
  #landing .features span { display: flex; align-items: center; gap: 4px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; border: none; cursor: pointer; font-size: 16px; font-weight: 600;
    padding: 14px 32px; border-radius: 50px; transition: all .2s;
    font-family: inherit; -webkit-appearance: none;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary {
    background: linear-gradient(135deg, #c9a44b, #e0c068);
    color: #1a1a2e; box-shadow: 0 4px 20px rgba(201,164,75,.30);
    font-weight: 700;
  }

  /* ==================== Quiz ==================== */
  #quiz { padding-top: 36px; }
  .quiz-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; font-size: 13px; color: var(--sub);
  }
  .progress-bar {
    width: 100%; height: 5px; background: var(--bar-bg); border-radius: 3px;
    margin-bottom: 28px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2));
    border-radius: 3px; transition: width .4s ease;
  }

  .question-card {
    background: var(--card); border-radius: var(--radius);
    padding: 24px 20px; box-shadow: var(--shadow);
    margin-bottom: 20px; border: 1px solid var(--border);
  }
  .question-num { font-size: 12px; color: var(--gold); font-weight: 600; margin-bottom: 10px; letter-spacing: 1px; }
  .question-text { font-size: 18px; font-weight: 600; line-height: 1.6; color: var(--text); }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; border: 1.5px solid var(--border);
    border-radius: 10px; cursor: pointer; transition: all .2s;
    font-size: 14px; background: var(--card);
  }
  .option:active { background: #282445; }
  .option.selected { border-color: var(--gold); background: rgba(201,164,75,.08); }
  .option .dot {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #4a4560; flex-shrink: 0; transition: all .2s;
  }
  .option.selected .dot {
    border-color: var(--gold); background: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,164,75,.2);
  }

  .quiz-nav { display: flex; gap: 12px; margin-top: auto; padding-bottom: 28px; }
  .quiz-nav .btn { flex: 1; }
  .quiz-nav .btn-prev {
    background: transparent; color: var(--sub); border: 1.5px solid var(--border);
    font-size: 14px;
  }

  .slide-enter { animation: slideIn .35s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

  /* ==================== Results ==================== */
  #results { padding-top: 40px; align-items: center; text-align: center; }

  .result-badge {
    width: 110px; height: 110px; border-radius: 50%;
    background: linear-gradient(135deg, #c9a44b, #e0c068);
    color: #1a1a2e; display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    margin-bottom: 6px; box-shadow: 0 8px 32px rgba(201,164,75,.30);
    font-family: "Courier New", monospace;
  }
  .result-name { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .result-alias { font-size: 14px; color: var(--sub); margin-bottom: 20px; }

  .deck-recommend {
    width: 100%; background: linear-gradient(135deg, #2a2540, #252040);
    border-radius: var(--radius); padding: 20px 24px;
    box-shadow: var(--shadow); margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .deck-recommend h3 { font-size: 13px; color: var(--gold); margin-bottom: 12px; text-align: left; letter-spacing: 1px; text-transform: uppercase; }
  .deck-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 8px;
    text-align: left; display: flex; align-items: center; gap: 12px;
  }
  .deck-card:last-child { margin-bottom: 0; }
  .deck-icon {
    width: 44px; height: 44px; border-radius: 8px;
    background: linear-gradient(135deg, #c9a44b40, #e0c06820);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .deck-info { flex: 1; }
  .deck-name { font-size: 15px; font-weight: 700; color: var(--text); }
  .deck-desc { font-size: 12px; color: var(--sub); margin-top: 2px; line-height: 1.4; }

  .dimensions {
    width: 100%; background: var(--card); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .dimensions h3 { font-size: 13px; color: var(--gold); margin-bottom: 14px; text-align: left; letter-spacing: 1px; text-transform: uppercase; }
  .dim-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    font-size: 12px; font-weight: 600;
  }
  .dim-row:last-child { margin-bottom: 0; }
  .dim-row .left, .dim-row .right { width: 44px; text-align: center; flex-shrink: 0; font-size: 11px; }
  .dim-row .left { color: var(--gold); }
  .dim-row .right { color: var(--accent2); }
  .dim-bar-wrap { flex: 1; height: 7px; background: var(--bar-bg); border-radius: 4px; overflow: hidden; display: flex; }
  .dim-bar-left, .dim-bar-right { height: 100%; transition: width .6s ease; }
  .dim-bar-left { background: var(--gold); border-radius: 4px 0 0 4px; }
  .dim-bar-right { background: var(--accent); border-radius: 0 4px 4px 0; }
  .dim-pct { font-size: 11px; color: var(--sub); width: 44px; text-align: center; flex-shrink: 0; }

  .desc-card {
    width: 100%; background: var(--card); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 20px;
    text-align: left; border: 1px solid var(--border);
  }
  .desc-card h3 { font-size: 13px; color: var(--gold); margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .desc-card p { font-size: 14px; line-height: 1.7; color: var(--text); }

  .result-actions { display: flex; gap: 12px; width: 100%; padding-bottom: 36px; }
  .result-actions .btn { flex: 1; }
  .btn-share { background: linear-gradient(135deg, #c9a44b, #e0c068); color: #1a1a2e; font-weight: 700; }
  .btn-retry { background: transparent; color: var(--sub); border: 1.5px solid var(--border); }

  /* ==================== Share Modal ==================== */
  #share-modal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.75); justify-content: center; align-items: center;
    padding: 24px;
  }
  #share-modal.show { display: flex; }
  #share-modal .modal-inner {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    max-width: 340px; width: 100%; text-align: center; border: 1px solid var(--border);
  }
  #share-modal .modal-inner h3 { margin-bottom: 16px; font-size: 17px; color: var(--text); }
  #share-modal canvas { width: 100%; border-radius: 10px; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions .btn { flex: 1; font-size: 14px; padding: 12px 16px; }
  .btn-close { background: var(--bar-bg); color: var(--text); }
  .btn-save { background: linear-gradient(135deg, #c9a44b, #e0c068); color: #1a1a2e; font-weight: 700; }

  /* ==================== Toast ==================== */
  .toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #1a1a2e; padding: 12px 24px; border-radius: 50px;
    font-size: 14px; font-weight: 600; z-index: 200; opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">

  <!-- ============ Landing ============ -->
  <div class="page active" id="landing">
    <div class="logo">🃏</div>
    <h1>游戏王卡组人格测试</h1>
    <p class="subtitle">通过你的打牌风格和人格偏好<br>发现最适合你的游戏王卡组</p>
    <div class="acronym">Y G O T I</div>
    <div class="features">
      <span>📝 36题</span>
      <span>⏱ 约5分钟</span>
      <span>🎴 24卡组</span>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">决斗开始！</button>
  </div>

  <!-- ============ Quiz ============ -->
  <div class="page" id="quiz">
    <div class="quiz-header">
      <span id="q-progress-text">第 1/36 题</span>
      <span id="q-category"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

    <div class="question-card" id="question-card">
      <div class="question-num" id="q-num">Q1</div>
      <div class="question-text" id="q-text"></div>
    </div>

    <div class="options" id="options-container"></div>

    <div class="quiz-nav">
      <button class="btn btn-prev" id="btn-prev" onclick="prevQuestion()">← 上一题</button>
    </div>
  </div>

  <!-- ============ Results ============ -->
  <div class="page" id="results">
    <div class="result-badge" id="result-badge"></div>
    <div class="result-name" id="result-name"></div>
    <div class="result-alias" id="result-alias"></div>

    <div class="deck-recommend">
      <h3>推荐卡组</h3>
      <div id="deck-cards"></div>
    </div>

    <div class="dimensions">
      <h3>决斗者维度分析</h3>
      <div id="dims-container"></div>
    </div>

    <div class="desc-card">
      <h3>你的决斗者档案</h3>
      <p id="result-desc"></p>
    </div>

    <div class="result-actions">
      <button class="btn btn-retry" onclick="restart()">重新测试</button>
      <button class="btn btn-share" onclick="openShare()">分享结果</button>
    </div>
  </div>

</div>

<!-- ============ Share Modal ============ -->
<div id="share-modal">
  <div class="modal-inner">
    <h3>分享你的决斗者档案</h3>
    <canvas id="share-canvas" width="600" height="900"></canvas>
    <div class="modal-actions">
      <button class="btn btn-close" onclick="closeShare()">关闭</button>
      <button class="btn btn-save" onclick="saveImage()">保存图片</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================== DATA =====================

// 36 questions: 9 per dimension

// A=Aggro强攻 / D=Defense防守
// S=Soul魂系 / M=Meta竞技
// Q=Quick速攻 / G=Grind持久

const questions = [
  // ===== C/R 维度: 展开 vs 应对 (9题) =====

  // ===== A/D 维度: 强攻 vs 防守 (9题) =====
  { text: "战斗阶段是游戏王最让人热血沸腾的环节", dim: "AD", dir: 1 },
  { text: "看到对面空场，你脑中只有一个念头：OTK", dim: "AD", dir: 1 },
  { text: "高攻击力大怪拍下来就是牌佬的浪漫", dim: "AD", dir: 1 },
  { text: "后手突破成功时你会想喊一声「这就是我的王牌！」", dim: "AD", dir: 1 },

// ===================== STATE =====================

let currentQ = 0;
let answers = new Array(questions.length).fill(0);
let isAdvancing = false;

// ===================== VIEW SWITCHING =====================

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===================== QUIZ =====================

function startQuiz() {
  currentQ = 0;
  answers = new Array(questions.length).fill(0);
  showPage('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  const pct = Math.round((currentQ / questions.length) * 100);
  document.getElementById('q-progress-text').textContent = `第 ${currentQ + 1}/${questions.length} 题`;
  document.getElementById('q-num').textContent = `Q${currentQ + 1}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('progress-fill').style.width = pct + '%';

  const btnPrev = document.getElementById('btn-prev');
  btnPrev.style.visibility = currentQ === 0 ? 'hidden' : 'visible';

  const options = [
    { value: 5, label: '非常同意' },
    { value: 4, label: '比较同意' },
    { value: 3, label: '一般 / 不确定' },
    { value: 2, label: '不太同意' },
    { value: 1, label: '非常不同意' },
  ];

  const container = document.getElementById('options-container');
  container.innerHTML = '';
  options.forEach(opt => {
    const div = document.createElement('div');
    div.className = 'option';
    if (answers[currentQ] === opt.value) div.classList.add('selected');
    div.innerHTML = `<span class="dot"></span>${opt.label}`;
    div.addEventListener('click', () => selectOption(opt.value));
    container.appendChild(div);
  });

  const card = document.getElementById('question-card');
  card.classList.remove('slide-enter');
  void card.offsetWidth;
  card.classList.add('slide-enter');

  isAdvancing = false;
}

function selectOption(value) {
  if (isAdvancing) return;
  answers[currentQ] = value;

  const container = document.getElementById('options-container');
  const children = container.children;
  const options = [
    { value: 5 }, { value: 4 }, { value: 3 }, { value: 2 }, { value: 1 },
  ];
  for (let i = 0; i < children.length; i++) {
    children[i].classList.toggle('selected', options[i].value === value);
  }

  isAdvancing = true;
  setTimeout(() => {
    if (currentQ < questions.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      showResults();
    }
  }, 380);
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

// ===================== SCORING =====================

function calculateResults() {
  const scores = { CR: 0, AD: 0, SM: 0, QG: 0 };
  const counts = { CR: 0, AD: 0, SM: 0, QG: 0 };

  questions.forEach((q, i) => {
    if (answers[i] === 0) return;
    scores[q.dim] += answers[i] * q.dir;
    counts[q.dim] += 5;
  });

  const pcts = {};
  for (const dim of ['CR', 'AD', 'SM', 'QG']) {
    const maxScore = counts[dim];
    pcts[dim] = Math.round(((scores[dim] + maxScore) / (2 * maxScore)) * 100);
  }

  const typeCode =
    (pcts.CR >= 50 ? 'C' : 'R') +
    (pcts.AD >= 50 ? 'A' : 'D') +
    (pcts.SM >= 50 ? 'S' : 'M') +
    (pcts.QG >= 50 ? 'Q' : 'G');

  return { scores, pcts, typeCode };
}

// ===================== RESULTS =====================

function showResults() {
  const { pcts, typeCode } = calculateResults();
  const type = types[typeCode];

  showPage('results');
  document.getElementById('result-badge').textContent = typeCode;
  document.getElementById('result-name').textContent = typeCode + ' · ' + type.name;
  document.getElementById('result-alias').textContent = type.alias;
  document.getElementById('result-desc').textContent = type.desc;

  // Deck cards
  const deckContainer = document.getElementById('deck-cards');
  deckContainer.innerHTML = type.decks.map(d => {
    const info = deckDB[d] || { icon: '🃏', desc: '', playstyle: '' };
    return `
      <div class="deck-card">
        <div class="deck-icon">${info.icon}</div>
        <div class="deck-info">
          <div class="deck-name">${d}</div>
          <div class="deck-desc">${info.desc}</div>
        </div>
      </div>`;
  }).join('');

  // Dimension bars
  const dimLabels = {
    CR: { left: 'C 展开型', right: 'R 应对型' },
    AD: { left: 'A 强攻型', right: 'D 防守型' },
    SM: { left: 'S 魂系', right: 'M 竞技' },
    QG: { left: 'Q 速攻', right: 'G 持久' },
  };

  const dimsContainer = document.getElementById('dims-container');
  dimsContainer.innerHTML = '';
  for (const dim of ['CR', 'AD', 'SM', 'QG']) {
    const p = pcts[dim];
    const labels = dimLabels[dim];
    const row = document.createElement('div');
    row.className = 'dim-row';
    row.innerHTML = `
      <span class="left">${labels.left}</span>
      <div class="dim-bar-wrap">
        <div class="dim-bar-left" style="width:${p}%"></div>
        <div class="dim-bar-right" style="width:${100 - p}%"></div>
      </div>
      <span class="right">${labels.right}</span>
      <span class="dim-pct">${p}% / ${100 - p}%</span>
    `;
    dimsContainer.appendChild(row);
  }

  window._resultData = { pcts, typeCode, type };
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}

function restart() {
  currentQ = 0;
  answers = new Array(questions.length).fill(0);
  startQuiz();
}

function drawShareCanvas() {

  bg.addColorStop(1, '#222240');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.roundRect(0, 0, W, H, 24);
  ctx.fill();

  // Gold border
  ctx.strokeStyle = '#c9a44b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(15, 15, W - 30, H - 30, 18);

  ctx.fillStyle = '#c9a44b';
  ctx.font = 'bold 16px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('YGOTI · 游戏王卡组人格测试', W / 2, 62);

  // Type badge
  const badgeGrad = ctx.createLinearGradient(W / 2 - 60, 0, W / 2 + 60, 0);
  badgeGrad.addColorStop(0, '#c9a44b');
  badgeGrad.addColorStop(1, '#e0c068');
  ctx.fillStyle = badgeGrad;
  ctx.beginPath();
  ctx.roundRect(W / 2 - 60, 85, 120, 110, 55);
  ctx.fill();

  ctx.fillStyle = '#1a1a2e';
  ctx.font = 'bold 30px "Courier New", monospace';
  ctx.fillText(typeCode, W / 2, 155);

  ctx.fillStyle = '#e8e0d0';
  ctx.font = 'bold 22px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(type.name, W / 2, 225);

  ctx.fillStyle = '#9a9484';
  ctx.font = '14px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(type.alias, W / 2, 250);

  // Deck section
  let y = 280;
  ctx.fillStyle = '#c9a44b';
  ctx.font = 'bold 14px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('推荐卡组', 50, y);

  y += 20;
  type.decks.forEach(d => {
    const info = deckDB[d] || { icon: '🃏', desc: '', playstyle: '' };
    ctx.fillStyle = '#222240';
    ctx.beginPath();
    ctx.roundRect(50, y, W - 100, 44, 8);
    ctx.fill();
    ctx.fillStyle = '#e8e0d0';
    ctx.font = '15px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText(info.icon + '  ' + d, 64, y + 30);
    y += 56;
  });

  // Dimension bars
  y += 8;
  ctx.fillStyle = '#c9a44b';
  ctx.font = 'bold 14px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('决斗者维度', 50, y);
  y += 20;

  const dimLabels = {
    CR: ['C 展开', 'R 应对'],
    AD: ['A 强攻', 'D 防守'],
    SM: ['S 魂系', 'M 竞技'],
    QG: ['Q 速攻', 'G 持久'],
  };
  const dimOrder = ['CR', 'AD', 'SM', 'QG'];
  const barLeft = 50;
  const barWidth = W - 100;

  ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
  dimOrder.forEach(dim => {
    const p = pcts[dim];
    const labels = dimLabels[dim];

    ctx.fillStyle = '#c9a44b';
    ctx.textAlign = 'left';
    ctx.fillText(labels[0], barLeft, y + 10);
    ctx.fillStyle = '#6da0e8';
    ctx.textAlign = 'right';
    ctx.fillText(labels[1], barLeft + barWidth, y + 10);
    ctx.textAlign = 'left';

    ctx.fillStyle = '#2e2a40';
    ctx.beginPath();
    ctx.roundRect(barLeft + 44, y - 2, barWidth - 88, 14, 7);
    ctx.fill();

    const leftW = Math.round((barWidth - 88) * p / 100);
    if (leftW > 0) {
      ctx.fillStyle = '#c9a44b';
      ctx.beginPath();
      ctx.roundRect(barLeft + 44, y - 2, Math.max(leftW, 7), 14, 7);
      ctx.fill();
    }
    const rightW = (barWidth - 88) - leftW;
    if (rightW > 0) {
      ctx.fillStyle = '#4a7dc9';
      ctx.beginPath();
      ctx.roundRect(barLeft + 44 + leftW, y - 2, rightW, 14, 7);
      ctx.fill();
    }

    ctx.fillStyle = '#e8e0d0';
    ctx.font = 'bold 10px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p + '% : ' + (100 - p) + '%', W / 2, y + 9);
    ctx.textAlign = 'left';
    ctx.font = '11px -apple-system, "PingFang SC", sans-serif';

    y += 24;
  });

  // Footer
  y += 16;
  ctx.fillStyle = '#5a5570';
  ctx.font = '12px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('YGOTI · 找到你的本命卡组', W / 2, y);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  let line = '';
  for (let i = 0; i < text.length; i++) {
    const testLine = line + text[i];
    if (ctx.measureText(testLine).width > maxWidth && line.length > 0) {
      ctx.fillText(line, x, y);
      line = text[i];
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  if (line.length > 0) ctx.fillText(line, x, y);
}

// ===================== INIT =====================
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
    this.beginPath();
    this.moveTo(x + r.tl, y);
    this.lineTo(x + w - r.tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
    this.lineTo(x + w, y + h - r.br);
    this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
    this.lineTo(x + r.bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
    this.lineTo(x, y + r.tl);
    this.quadraticCurveTo(x, y, x + r.tl, y);
    this.closePath();
  };
}

document.getElementById('share-modal').addEventListener('click', function(e) {
  if (e.target === this) closeShare();
});
</script>
